[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "derm-explain"
version = "0.1.0"
description = "Explainable HAM10000 skin-lesion classification with DenseNet121, Grad-CAM and SHAP"
requires-python = ">=3.10"

[tool.setuptools.packages.find]
include = ["src*"]
